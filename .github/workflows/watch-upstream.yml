name: watch-upstream

# Poll bol-van/zapret2 for a new release and, when found, bump the package pin and
# kick off build.yml — so the fork auto-rebuilds every time upstream ships a release.
# (GitHub can't deliver another repo's release event here, hence the schedule.)

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6h, off the hour to dodge cron congestion
  workflow_dispatch:

permissions:
  contents: write       # push the bump branch
  pull-requests: write  # open + auto-merge the PR

jobs:
  watch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compare upstream latest release to our pin
        id: chk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG=$(gh api repos/bol-van/zapret2/releases/latest --jq '.tag_name')
          VER=${TAG#v}
          # Resolve the tag to its commit SHA (handle both lightweight and annotated tags).
          REF=$(gh api repos/bol-van/zapret2/git/refs/tags/$TAG)
          TYPE=$(echo "$REF" | jq -r '.object.type')
          SHA=$(echo "$REF" | jq -r '.object.sha')
          if [ "$TYPE" = "tag" ]; then
            SHA=$(gh api repos/bol-van/zapret2/git/tags/$SHA --jq '.object.sha')
          fi
          DATE=$(gh api repos/bol-van/zapret2/commits/$SHA --jq '.commit.committer.date' | cut -dT -f1)
          CUR=$(grep -oP '^PKG_SOURCE_VERSION:=\K.*' zapret2/Makefile)
          echo "Upstream: tag=$TAG ver=$VER sha=$SHA date=$DATE"
          echo "Current pin: $CUR"
          if [ "$SHA" = "$CUR" ]; then
            echo "Already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            {
              echo "changed=true"
              echo "ver=$VER"
              echo "sha=$SHA"
              echo "date=$DATE"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Bump package pin
        if: steps.chk.outputs.changed == 'true'
        run: |
          VER='${{ steps.chk.outputs.ver }}'
          SHA='${{ steps.chk.outputs.sha }}'
          DATE='${{ steps.chk.outputs.date }}'
          sed -i -E "s/^PKG_VERSION:=.*/PKG_VERSION:=$VER/" zapret2/Makefile luci-app-zapret2/Makefile
          sed -i -E "s/^PKG_SOURCE_VERSION:=.*/PKG_SOURCE_VERSION:=$SHA/" zapret2/Makefile
          sed -i -E "s/^PKG_SOURCE_DATE:=.*/PKG_SOURCE_DATE:=$DATE/" zapret2/Makefile
          echo "----- zapret2/Makefile head -----"
          sed -n '7,18p' zapret2/Makefile

      - name: Open PR with version bump
        if: steps.chk.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VER='${{ steps.chk.outputs.ver }}'
          SHA='${{ steps.chk.outputs.sha }}'
          BRANCH="bump-nfqws2-$VER"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # A repo ruleset blocks force-push and deletion on any branch, so a prior
          # failed run's branch can't be rewritten or cleaned up — reuse it instead of
          # minting a new one (this runs on a 6h cron, so retries must be idempotent).
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            echo "Branch $BRANCH already exists on origin, reusing it."
          else
            git checkout -b "$BRANCH"
            git add zapret2/Makefile luci-app-zapret2/Makefile
            git commit -m "zapret2: bump to $VER (nfqws2 $SHA)"
            git push -u origin "$BRANCH"
          fi
          # zap1 requires changes via PR, so we can't push straight to it. Open the PR
          # if it isn't already open. build.yml then fires on the resulting push to zap1
          # (see its `on.push` trigger).
          if ! gh pr view "$BRANCH" > /dev/null 2>&1; then
            gh pr create --base zap1 --head "$BRANCH" \
              --title "zapret2: bump to $VER" \
              --body "Automated bump of nfqws2 to \`$VER\` (upstream commit \`$SHA\`)."
          fi
          # zap1 has no required status checks, so the PR is immediately mergeable and
          # `--auto` is rejected ("clean status"). Try a direct merge; fall back to
          # queuing auto-merge only if the merge is currently blocked (e.g. checks were
          # added later and are still pending).
          gh pr merge "$BRANCH" --squash \
            || gh pr merge "$BRANCH" --squash --auto
